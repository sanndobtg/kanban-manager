server:
  port: 8080

spring:
  application:
    name: backend-spring

  datasource:
    url: jdbc:mariadb://localhost:3306/kanban_db
    username: kanban_user
    password: kanban_pass
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: mongodb://localhost:27017/kanban_mongo

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: kanban-super-secret-key-change-in-production
  expiration: 86400000
 