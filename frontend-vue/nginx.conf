server {
    listen 80;
    server_name localhost;

    # Fichiers statiques Vue.js
    root /usr/share/nginx/html;
    index index.html;

    # Taille max upload (fichiers)
    client_max_body_size 50M;

    # SPA fallback — toutes les routes Vue
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* vers Deno (qui relaie vers Spring)
    location /api/ {
        proxy_pass http://deno-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important pour multipart/upload
        proxy_request_buffering off;
    }

    # Proxy /login vers Deno
    location /login {
        proxy_pass http://deno-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /register vers Deno (si tu as une route inscription)
    location /register {
        proxy_pass http://deno-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /.well-known vers Deno (JWKS)
    location /.well-known/ {
        proxy_pass http://deno-server:3000;
        proxy_set_header Host $host;
    }

    # Proxy WebSocket vers Deno
    location /ws/ {
        proxy_pass http://deno-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
